services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    networks:
      - ielts-network
    env_file:
      - .env
    extra_hosts:
      # Required on Linux hosts; Docker Desktop for Mac has this built-in.
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      # Persist the Whisper model cache so it isn't re-downloaded on every rebuild
      - whisper_cache:/root/.cache/huggingface
    ports:
      - '${PORT}:${PORT}'
    restart: unless-stopped
    tty: true
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
      minio-init:
        condition: service_started
    command: sh -c "npm install && npm run dev"

  cron:
    build:
      context: ./
      dockerfile: Dockerfile
    networks:
      - ielts-network
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
    tty: true
    depends_on:
      - postgres
    command: sh -c "npm install && npm run dev:cron"

  consumer:
    build:
      context: ./
      dockerfile: Dockerfile
    networks:
      - ielts-network
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
    tty: true
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    command: sh -c "npm install && npm run dev:consumer"

  postgres:
    image: 'postgres:13'
    restart: always
    networks:
      - ielts-network
    ports:
      - '5432:5432'
    command: [ "postgres", "-cshared_preload_libraries=pg_stat_statements", "-c", "max_connections=500", "-c", "shared_buffers=3GB" ]
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      PGDATA: '/var/lib/postgresql/data'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: 'ielts'

  # ── MinIO: S3-compatible object storage for audio recordings ──
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks:
      - ielts-network
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # One-shot init container: creates the default bucket if it doesn't exist
  minio-init:
    image: minio/mc:latest
    networks:
      - ielts-network
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/ielts-audio;
        mc anonymous set download local/ielts-audio;
        echo 'Bucket ielts-audio ready';
        exit 0;
      "
  # ── Kafka ──
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - ielts-network
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ── Kafka UI ──
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    networks:
      - ielts-network
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  ielts-network:
    driver: bridge

volumes:
  # Named volume keeps the downloaded Whisper base.en model between rebuilds
  whisper_cache: # Persist MinIO data (audio recordings) between container restarts

  minio_data:
